version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: fleet_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    container_name: fleet_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/fleet_management
      - JWT_SECRET=your_jwt_secret_key_here
      - REFRESH_TOKEN_SECRET=your_refresh_token_key_here
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run dev
    depends_on:
      - mongodb

volumes:
  mongo_data: